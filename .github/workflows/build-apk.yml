name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Validate web and production assets
        run: npm run test:static

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Verify debug APK
        env:
          APK: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          test -s "$APK"
          unzip -t "$APK"
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | grep -F "package: name='com.titanpulse.app'"
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | grep -F "application-label:'TITAN PULSE'"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/36.0.0/zipalign -c -v 4 "$APK"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: titan-pulse-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk